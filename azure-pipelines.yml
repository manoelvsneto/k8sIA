trigger:
  branches:
    include:
      - main

pool:
  name: Arm64

stages:
  - stage: Deploy
    displayName: Deploy Ollama to Kubernetes
    jobs:
      - job: DeployOllama
        displayName: Apply Ollama manifests
        timeoutInMinutes: 60
        steps:
          - checkout: self

          - task: Kubernetes@1
            displayName: Set kubectl context for Argo CD repository secret
            inputs:
              connectionType: Kubernetes Service Connection
              kubernetesServiceEndpoint: K8SOracleCloud
              namespace: argocd
              command: login

          - bash: |
              set +x
              set -euo pipefail
              : "${AZURE_REPOS_OLLAMA_TOKEN:?Configure AZURE_REPOS_OLLAMA_TOKEN as a secret pipeline variable.}"

              password_base64="$(printf '%s' "$AZURE_REPOS_OLLAMA_TOKEN" | base64 | tr -d '\n')"
              cat <<EOF | kubectl --insecure-skip-tls-verify=true apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: azure-repos-ollama
                namespace: argocd
                labels:
                  argocd.argoproj.io/secret-type: repository
              type: Opaque
              stringData:
                url: https://devbit.visualstudio.com/Devbit/_git/CSAAS
                username: argocd
              data:
                password: ${password_base64}
              EOF
            displayName: Create Argo CD repository secret
            env:
              AZURE_REPOS_OLLAMA_TOKEN: $(AZURE_REPOS_OLLAMA_TOKEN)

          - bash: |
              set -euo pipefail
              kubectl --insecure-skip-tls-verify=true \
                --namespace ollama \
                delete job/ollama-pull-lfm3 \
                --ignore-not-found=true \
                --wait=true
            displayName: Remove previous model pull job

          - bash: |
              set -euo pipefail
              manifests="$(Build.SourcesDirectory)/k8s/ollama-lfm3-oci-arm64"
              kubectl --insecure-skip-tls-verify=true \
                apply -f "$manifests/namespace.yaml"
              kubectl --insecure-skip-tls-verify=true \
                apply \
                -f "$manifests/storageclass.yaml" \
                -f "$manifests/pvc.yaml" \
                -f "$manifests/deployment.yaml" \
                -f "$manifests/service.yaml" \
                -f "$manifests/model-pull-job.yaml"
            displayName: Apply Ollama manifests

          - bash: |
              set -euo pipefail
              kubectl --insecure-skip-tls-verify=true \
                --namespace ollama \
                rollout status deployment/ollama \
                --timeout=10m
            displayName: Wait for Ollama deployment

          - bash: |
              set -euo pipefail
              kubectl --insecure-skip-tls-verify=true wait \
                --namespace ollama \
                --for=condition=complete \
                job/ollama-pull-lfm3 \
                --timeout=45m
            displayName: Wait for LFM3 model download
