apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-model-pull-script
  namespace: ollama
data:
  pull-model.sh: |
    #!/bin/sh
    set -eu

    attempt=0
    max_attempts=180
    until ollama list >/dev/null 2>&1; do
      attempt=$((attempt + 1))
      if [ "$attempt" -ge "$max_attempts" ]; then
        echo "Ollama API did not become ready within 15 minutes." >&2
        exit 1
      fi
      sleep 5
    done

    echo "Pulling ${OLLAMA_MODEL} from Hugging Face through Ollama..."
    ollama pull "$OLLAMA_MODEL"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-lfm3
  namespace: ollama
  labels:
    app.kubernetes.io/name: ollama-model-pull
    app.kubernetes.io/part-of: ollama-lfm3
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-model-pull
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: pull-model
          image: ollama/ollama:0.40.12
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /scripts/pull-model.sh
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              value: hf.co/LiquidAI/LFM3-1.7B-GGUF:Q4_K_M
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: pull-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: pull-script
          configMap:
            name: ollama-model-pull-script
            defaultMode: 0555
